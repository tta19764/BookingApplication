services:
  bookingapp.api:
    container_name: bookingapp.api
    image: bookingapp.api
    build:
      context: .
      dockerfile: BookingApp.Services.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: ${ConnectionStrings__Database:?Set the remote SQL Server connection string}
      Serilog__WriteTo__1__Args__serverUrl: http://bookingapp.seq:5341
    ports:
      - "8080:8080"
    depends_on:
      bookingapp.seq:
        condition: service_started
  bookingapp.seq:
    container_name: bookingapp.seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - bookingapp-seq-dev-data:/data

volumes:
  bookingapp-seq-dev-data:
